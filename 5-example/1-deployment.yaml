---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: 5-example
  labels:
    app.kubernetes.io/name: myapp
spec:
  # Multi-AZ High Availability: increased from 1 to 2 replicas
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: aputra/myapp-195:v2
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 128Mi
              cpu: 100m
          # Readiness Probe: ensures AWS NLB IP target only sends traffic after port 8080 is up
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          # Liveness Probe: automatically restarts dead/hung containers
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

